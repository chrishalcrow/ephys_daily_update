[project]
name = "ephys-daily-update"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chrishalcrow", email = "chrishalcrow@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aeon-mecha",
    "spikeinterface[lupin]>=0.105.3",
]

[project.scripts]
ephys-daily-update = "ephys_daily_update:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
aeon-mecha = { git = "https://github.com/SainsburyWellcomeCentre/aeon_mecha/" }
spikeinterface = { path = "../spikeinterface", editable = true }
